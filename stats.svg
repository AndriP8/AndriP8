<svg width="450" height="363" xmlns="http://www.w3.org/2000/svg">
  <style>
    .monospace { font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Monaco, Consolas, monospace; }
    .font-bold { font-weight: 700; }
    .font-normal { font-weight: 400; }
    .text-title { font-size: 24px; }
    .text-label { font-size: 13px; }
    .text-main { font-size: 13px; }
    .text-percentage { font-size: 13px; }
    
    @media (prefers-color-scheme: dark) {
      .text-title { fill: #c9d1d9; }
      .text-label { fill: #8b949e; }
      .text-main { fill: #c9d1d9; }
      .text-percentage { fill: #8b949e; }
      .progress-bg { fill: #21262d; }
      .progress-bar { fill: #c9d1d9; }
    }
    @media (prefers-color-scheme: light) {
      .text-title { fill: #24292f; }
      .text-label { fill: #57606a; }
      .text-main { fill: #24292f; }
      .text-percentage { fill: #57606a; }
      .progress-bg { fill: #afb8c1; fill-opacity: 0.2; }
      .progress-bar { fill: #24292f; }
    }
  </style>
  
  <!-- Column 1: Commits -->
  <text x="20" y="45" class="monospace font-bold text-title">1,465</text>
  <text x="20" y="65" class="monospace font-normal text-label">commits</text>
  
  <!-- Column 2: PRs -->
  <text x="140" y="45" class="monospace font-bold text-title">61</text>
  <text x="140" y="65" class="monospace font-normal text-label">prs</text>
  
  <!-- Column 3: Stars -->
  <text x="250" y="45" class="monospace font-bold text-title">35</text>
  <text x="250" y="65" class="monospace font-normal text-label">stars</text>
  
  <!-- Column 4: Issues -->
  <text x="350" y="45" class="monospace font-bold text-title">3</text>
  <text x="350" y="65" class="monospace font-normal text-label">issues</text>
  
  <!-- WakaTime Title -->
  <text x="20" y="110" class="monospace font-bold text-main">All time · 127 hrs 18 mins</text>
  
  
    <!-- TypeScript -->
    <text x="20" y="147" class="monospace font-normal text-main">TypeScript</text>
    <rect x="150" y="138" width="200" height="10" rx="5" ry="5" class="progress-bg" />
    <rect x="150" y="138" width="140" height="10" rx="5" ry="5" class="progress-bar" />
    <text x="365" y="147" class="monospace font-normal text-percentage">70.2%</text>
    
    <!-- Markdown -->
    <text x="20" y="173" class="monospace font-normal text-main">Markdown</text>
    <rect x="150" y="164" width="200" height="10" rx="5" ry="5" class="progress-bg" />
    <rect x="150" y="164" width="20" height="10" rx="5" ry="5" class="progress-bar" />
    <text x="365" y="173" class="monospace font-normal text-percentage">10.0%</text>
    
    <!-- JSON -->
    <text x="20" y="199" class="monospace font-normal text-main">JSON</text>
    <rect x="150" y="190" width="200" height="10" rx="5" ry="5" class="progress-bg" />
    <rect x="150" y="190" width="8" height="10" rx="5" ry="5" class="progress-bar" />
    <text x="365" y="199" class="monospace font-normal text-percentage">4.2%</text>
    
    <!-- Other -->
    <text x="20" y="225" class="monospace font-normal text-main">Other</text>
    <rect x="150" y="216" width="200" height="10" rx="5" ry="5" class="progress-bg" />
    <rect x="150" y="216" width="7" height="10" rx="5" ry="5" class="progress-bar" />
    <text x="365" y="225" class="monospace font-normal text-percentage">3.7%</text>
    
    <!-- Bash -->
    <text x="20" y="251" class="monospace font-normal text-main">Bash</text>
    <rect x="150" y="242" width="200" height="10" rx="5" ry="5" class="progress-bg" />
    <rect x="150" y="242" width="6" height="10" rx="5" ry="5" class="progress-bar" />
    <text x="365" y="251" class="monospace font-normal text-percentage">2.8%</text>
    
    <!-- YAML -->
    <text x="20" y="277" class="monospace font-normal text-main">YAML</text>
    <rect x="150" y="268" width="200" height="10" rx="5" ry="5" class="progress-bg" />
    <rect x="150" y="268" width="5" height="10" rx="5" ry="5" class="progress-bar" />
    <text x="365" y="277" class="monospace font-normal text-percentage">2.4%</text>
    
    <!-- SQL -->
    <text x="20" y="303" class="monospace font-normal text-main">SQL</text>
    <rect x="150" y="294" width="200" height="10" rx="5" ry="5" class="progress-bg" />
    <rect x="150" y="294" width="4" height="10" rx="5" ry="5" class="progress-bar" />
    <text x="365" y="303" class="monospace font-normal text-percentage">1.8%</text>
    
    <!-- CSS -->
    <text x="20" y="329" class="monospace font-normal text-main">CSS</text>
    <rect x="150" y="320" width="200" height="10" rx="5" ry="5" class="progress-bg" />
    <rect x="150" y="320" width="3" height="10" rx="5" ry="5" class="progress-bar" />
    <text x="365" y="329" class="monospace font-normal text-percentage">1.6%</text>
    
</svg>